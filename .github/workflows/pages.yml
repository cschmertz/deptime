name: pages

# Rename-map pages on GitHub Pages (DT-GTM-02): `python -m deptime.site build` writes one page per well-known migration
# from the published index, plus a short landing page, llms.txt and sitemap.xml, and this workflow publishes them at
# https://cschmertz.github.io/deptime/. It runs after every index build, so the pages follow the data, and when the
# generator changes. Nothing on the pages is written by hand.
on:
  push:
    branches: [main]
    paths: ["src/deptime/site.py", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [build-index]
    types: [completed] # even a partly failed build may have published
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEPTIME_HOME: ${{ github.workspace }}/.deptime
  DEPTIME_OFFLINE: "1" # no background refresh; the explicit `index pull` still runs
  BASE_URL: https://cschmertz.github.io/deptime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --no-dev
      # --verify: only an index whose signed provenance names build-index.yml on main (DT-OSS-09).
      - run: uv run --no-dev deptime index pull --verify
      - run: uv run --no-dev python -m deptime.site build --out site/dist --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # deploy-pages proves the artifact came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
