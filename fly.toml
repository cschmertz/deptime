# Optional hosted mode on Fly.io (DT-HOST-01; docs/05). App name and public URL are placeholders.
app = "deptime"
primary_region = "iad"

[env]
  DEPTIME_PUBLIC_URL = "https://deptime.fly.dev"
  DEPTIME_CLIENT_IP_HEADER = "Fly-Client-IP"  # set by Fly's proxy; used for per-IP rate limits

[[mounts]]
  source = "deptime_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
