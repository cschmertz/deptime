name: release

# Publishes to PyPI, then to the official MCP Registry, when a version tag is pushed (git tag v0.1.0 && git push --tags).
# One-time setup: on pypi.org, add a "trusted publisher" for this repo + workflow + environment `pypi`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (no API token stored anywhere)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # A PyPI version can never be reused, so refuse to publish when the tag and the package disagree.
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(uv version --short)"
          init="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/deptime/__init__.py)"
          plugin="$(jq -r .version integrations/claude-code/.claude-plugin/plugin.json)"
          echo "tag=$tag pyproject=$pyproject __init__=$init plugin.json=$plugin"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$init" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version"
            exit 1
          fi
      - run: uv sync --locked && uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Lists the release on the official MCP Registry (server.json). The registry checks that PyPI has this version
  # and that its description carries `mcp-name: io.github.cschmertz/deptime`, so this runs after the PyPI job.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry (no token stored anywhere)
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # PyPI's JSON API can lag the upload by a minute, and the registry validates against it.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1

  # A GitHub release for the tag, so the repo's Releases list tracks PyPI. Edit its notes on GitHub afterwards.
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "DepTime ${GITHUB_REF_NAME#v}" --generate-notes
