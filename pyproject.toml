[project]
name = "deptime"
version = "0.1.0"
description = "API time machine for Python libraries: tells coding agents what changed, in which release, and what to use instead. Local-first MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cschmertz" }]
keywords = ["mcp", "model-context-protocol", "coding-agents", "deprecation", "api-changes", "griffe", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp>=2.3,<3",          # MCP Python SDK v2 (spec 2026-07-28): stdio + Streamable HTTP
  "griffe>=2.3,<3",       # static API extraction (only used by `deptime ingest`)
  "packaging>=24",        # version parsing/sorting, wheel filename parsing
  "httpx>=0.28",          # PyPI client + index download
  "pydantic>=2.11",       # tool input/output contracts
  "starlette>=1.0",       # HTTP routes alongside /mcp (hosted mode)
  "uvicorn>=0.35",        # ASGI server (hosted mode)
]

[project.urls]
Homepage = "https://github.com/cschmertz/deptime"
Repository = "https://github.com/cschmertz/deptime"
Issues = "https://github.com/cschmertz/deptime/issues"

[project.scripts]
deptime = "deptime.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deptime"]  # includes coverage.toml and index/schema.sql

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
  "network: hits PyPI and downloads wheels (run with: pytest -m network)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
