name: bench

# Traceback benchmark (DT-QA-02): replays bench/cases through explain_error against the published index, and fails
# when a metric drops by more than 2 points on the cases bench/baseline.json shares with this run. It runs on code
# changes and after every index build, so a regression in either the code or the data is caught.
# The TimeMachine-bench holdout (bench/tmb, DT-QA-04) is checked the same way against bench/tmb/baseline.json, and the
# per-release holdout (bench/holdout, DT-QA-07) against its set's baseline.json: check_symbols and diff_versions on code
# that works and code that breaks (recall may drop 2 points, the false-positive rate rise 1), and its tracebacks.
# bench/curated_check.py fails if a curated hint (DT-DATA-08) names something the index doesn't have.
# tests/test_golden.py (DT-QA-03) checks the newest releases: each package's is indexed within 24 h of upload, and
# each Tier A package's has the names its documentation uses (tests/golden/tier_a.toml).
# Record an intended change with: python -m deptime.bench bench/cases --write-baseline bench/baseline.json
# (and bench/tmb/cases with bench/tmb/baseline.json; bench/holdout/score.py <set> --write-baseline <set>/baseline.json)
on:
  push:
    branches: [main]
    paths: ["src/**", "bench/**", "tests/golden/**", "tests/test_golden.py", "uv.lock", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["src/**", "bench/**", "tests/golden/**", "tests/test_golden.py", "uv.lock", ".github/workflows/bench.yml"]
  workflow_run:
    workflows: [build-index]
    types: [completed] # even a partly failed build may have published
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPTIME_HOME: ${{ github.workspace }}/.deptime
  DEPTIME_OFFLINE: "1" # no background refresh; the explicit `index pull` still runs

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-dev
      # --verify: installs the index only if its signed build provenance names build-index.yml on main (DT-OSS-09),
      # so every published index is checked the way users check it. gh is preinstalled on GitHub's runners.
      - run: uv run --no-dev deptime index pull --verify
      - name: Run the benchmark
        run: |
          set -o pipefail
          uv run --no-dev python -m deptime.bench bench/cases --baseline bench/baseline.json 2>&1 | tee report.txt
      - name: Run the TimeMachine-bench holdout
        if: success() || failure()
        run: |
          set -o pipefail
          uv run --no-dev python -m deptime.bench bench/tmb/cases --baseline bench/tmb/baseline.json 2>&1 | tee report-tmb.txt
      - name: Run the per-release holdout (DT-QA-07)
        if: success() || failure()
        run: |
          set -o pipefail
          uv run --no-dev python bench/holdout/score.py bench/holdout/2026-11 --baseline bench/holdout/2026-11/baseline.json 2>&1 | tee report-holdout.md
      - name: Check the curated hints against the index (ADR 0006)
        if: success() || failure()
        run: |
          set -o pipefail
          uv run --no-dev python bench/curated_check.py 2>&1 | tee report-curated.txt
      - name: Golden tests against the published index (DT-QA-03)
        if: success() || failure()
        run: |
          set -o pipefail
          uv run --locked pytest -m published tests/test_golden.py -p no:cacheprovider 2>&1 | tee report-golden.txt
      - name: Add the reports to the job summary
        if: always()
        run: |
          for f in report.txt report-tmb.txt report-holdout.md report-curated.txt report-golden.txt; do
            if [ -f "$f" ]; then
              { echo "### $f"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
