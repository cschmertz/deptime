# DepTime coverage list: which distributions we index, their import names, and the version policy.
# Rationale for the selection lives in docs/03-product-spec.md §Coverage.
#
# `name`         = PyPI distribution name (normalized per PEP 503 at load time).
# `import_names` = top-level import paths the distribution provides. Used to map tracebacks to packages.
# `tier`         = A (AI/agent stack, highest churn) | B (classic libraries with documented breaks).
# `notes`        = known analysis caveats; see docs/07-risks-and-spikes.md.
# `namespace_skip` = modules below which folders without `__init__.py` stay unloaded (DT-DATA-23); other such
#                  folders under an import root load as packages, as Python imports them.
# `installed_as` = other distributions that install the same code with the same version numbers, as
#                  requirements whose specifier holds the versions that do; explain_error reads their installed
#                  version as this package's when this one isn't listed (DT-CORE-03).
# `shares_import_name_with` = distributions that install *other* code under the same import name; explain_error
#                  uses installed_versions or pip_freeze to tell which one raised (DT-CORE-03).
# `own_members`  = true (the default): store each class's own members once, with its MRO, and look inherited members
#                  up when queried, rather than storing every member under every class that has it (DT-DATA-16,
#                  DT-DATA-49). The answers are the same; an index with such a package has schema version 2, which
#                  deptime 0.1.5 and older can't read. `false` stores every member under every class.

[policy]
# For every minor series (X.Y) that has a release on/after `since`, index every release: a patch-level break
# needs both neighbours indexed (DT-DATA-19). `whole_series = false` keeps only each series' first and last.
since = "2023-01-01"
whole_series = true
# With `whole_series = false`, also index *every* release uploaded in the last N months.
recent_months = 12
include_prereleases = false
include_yanked = false

