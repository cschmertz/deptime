# Names that work at a release, each found by installing the release and asking Python (DT-DATA-103). A name that
# works and reads `missing` at the newer end of an update is a false break in `check-upgrade`, so
# tests/test_golden.py checks these against the published index after every build (bench.yml).
#
# `present`: the index must have the name. `not_missing`: `unknown` will do too, where the release can't be read
# without running it. `missing`: names the release really lacks, next to the ones above, so an answer of `unknown`
# for everything doesn't pass.

[[case]]
package = "numpy"
version = "2.5.5"
present = [
  "numpy.memmap.argsort",
  "numpy.memmap.astype",
  "numpy.memmap.sum",
  "numpy.memmap.shape",
  "numpy.memmap.T",
  "numpy.matrix.argsort",
  "numpy.matrix.astype",
  "numpy.recarray.argsort",
  "numpy.char.chararray.astype",
  "numpy.finfo.max",
]
missing = ["numpy.memmap.itemset", "numpy.matrix.itemset"]
evidence = "numpy 2.5.5 from PyPI on Python 3.13: hasattr() of each name on an instance (a memmap of three float32, `np.matrix([[1, 2], [3, 4]])`, a `np.rec.array`, `np.char.chararray`, `np.finfo(np.float64)`)"

[[case]]
package = "numpy"
version = "2.2.0"
present = ["numpy.matrix.argsort", "numpy.memmap.astype", "numpy.recarray.argsort", "numpy.finfo.max", "numpy.finfo.eps"]
evidence = "numpy 2.2.0 from PyPI on Python 3.13: hasattr() of each name on an instance, as for 2.5.5"

[[case]]
package = "numpy"
version = "2.3.5"
present = ["numpy.finfo.max", "numpy.finfo.eps", "numpy.finfo.tiny", "numpy.matrix.argsort"]
evidence = "numpy 2.3.5 from PyPI on Python 3.13: hasattr() of each name on `np.finfo(np.float64)` and a matrix"

# gradio 6.20.0 to 6.26 shipped without the stub files that spell out each component's event methods, which a
# metaclass makes from the class's `EVENTS` list.
[[case]]
package = "gradio"
version = "6.22.0"
not_missing = ["gradio.Button.click", "gradio.Textbox.submit", "gradio.Textbox.change", "gradio.HTML.change", "gradio.Chatbot.like", "gradio.Dropdown.select"]
evidence = "gradio 6.22.0 from PyPI on Python 3.13: hasattr(gr.Button, 'click') and so on are all True"

[[case]]
package = "gradio"
version = "6.19.0"
present = ["gradio.Button.click", "gradio.Textbox.submit", "gradio.HTML.change"]
missing = ["gradio.Button.style", "gradio.Textbox.update"]
evidence = "gradio 6.19.0 from PyPI on Python 3.13: hasattr() is True for the first three and False for `gr.Button.style` and `gr.Textbox.update`, which 4.0 removed"

# redis's async client takes its hash, list and ACL commands from bases it names through an attribute
# (`AsyncHashCommands = HashCommands`).
[[case]]
package = "redis"
version = "8.2.0"
present = ["redis.asyncio.Redis.hset", "redis.asyncio.Redis.lpush", "redis.asyncio.Redis.acl_list", "redis.asyncio.Redis.get"]
evidence = "redis 8.2.0 from PyPI on Python 3.13: hasattr(redis.asyncio.Redis, name) is True for each"

# transformers 5.0's Python tokenizers take `encode`, `save_pretrained` and the rest from a base class they name
# through an attribute.
[[case]]
package = "transformers"
version = "5.0.0"
present = [
  "transformers.BertJapaneseTokenizer.encode",
  "transformers.CTRLTokenizer.batch_decode",
  "transformers.RoFormerTokenizer.apply_chat_template",
  "transformers.CanineTokenizer.encode",
  "transformers.BartphoTokenizer.save_pretrained",
]
evidence = "transformers 5.0.0 with sentencepiece and protobuf from PyPI on Python 3.13: hasattr() of each name on the class is True"
