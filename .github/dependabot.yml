# Weekly update PRs for the locked Python dependencies (uv.lock) and the SHA-pinned GitHub Actions (DT-OSS-07).
# Each ecosystem's minor and patch updates arrive as one PR; a major update gets a PR of its own.
# A uv.lock change runs ci (tests and pip-audit) and bench (the benchmark against the published index).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
        # griffe gets a PR of its own: a new extractor can change snapshots without a SNAPSHOT_FORMAT bump, and cached
        # snapshots aren't rebuilt, so compare a few packages' snapshots before and after merging it.
        exclude-patterns: [griffe]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
