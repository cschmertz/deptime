# Migration hints (DT-DATA-08): a name the index has, and what its project's own migration guide, changelog or
# deprecation message says to use instead, quoted verbatim, with the page's URL. Each enters the index at assembly
# with source "curated" (confidence 0.9) when the package has the name, or for an argument `path(param)`, when the
# function ever took it. A target may be another covered package's name (DT-DATA-07).
#
# A hint ships only if it passes three checks (ADR 0006); one that fails is fixed from the page's text or dropped:
# - the quote is on the page: `uv run pytest -m network tests/test_curated.py`. In a quote, " … " leaves text out
#   (each excerpt must appear, in order) and " | " separates a table row's cells; a Python file's adjacent string
#   literals count as the one message they build;
# - the quote names both the old name and its replacement: `uv run pytest tests/test_curated.py`;
# - the index has both: `uv run python bench/curated_check.py` (also run by bench.yml).
#
# [[hint]]
# package = "<covered distribution>"
# path = "<indexed public path>" or "<function path>(<argument>)"
# target = "<public path>" or, for an argument, "<parameter to pass instead>"
# quote = "<what the source says, verbatim, one line>"
# url = "<https URL of the page>"


