# DepTime coverage list: which distributions we index, their import names, and the version policy.
# Rationale for the selection lives in docs/03-product-spec.md §Coverage.
#
# `name`         = PyPI distribution name (normalized per PEP 503 at load time).
# `import_names` = top-level import paths the distribution provides. Used to map tracebacks to packages.
# `tier`         = A (AI/agent stack, highest churn) | B (classic libraries with documented breaks).
# `notes`        = known analysis caveats; see docs/07-risks-and-spikes.md.

[policy]
# For every minor series (X.Y) that has a release on/after `since`, index its first and last release.
since = "2023-01-01"
# Additionally index *every* release uploaded in the last N months (patch-level precision where it matters).
recent_months = 12
include_prereleases = false
include_yanked = false

