name: bench

# Traceback benchmark (DT-QA-02): replays bench/cases through explain_error against the published index, and fails
# when a metric drops by more than 2 points on the cases bench/baseline.json shares with this run. It runs on code
# changes and after every nightly index build, so a regression in either the code or the data is caught.
# Record an intended change with: python -m deptime.bench bench/cases --write-baseline bench/baseline.json
on:
  push:
    branches: [main]
    paths: ["src/**", "bench/**", "uv.lock", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["src/**", "bench/**", "uv.lock", ".github/workflows/bench.yml"]
  workflow_run:
    workflows: [build-index]
    types: [completed] # even a partly failed build may have published
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPTIME_HOME: ${{ github.workspace }}/.deptime
  DEPTIME_OFFLINE: "1" # no background refresh; the explicit `index pull` still runs

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev deptime index pull
      - name: Run the benchmark
        run: |
          set -o pipefail
          uv run --no-dev python -m deptime.bench bench/cases --baseline bench/baseline.json 2>&1 | tee report.txt
      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f report.txt ]; then
            { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
