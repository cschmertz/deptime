name: build-index

# Nightly: analyse new PyPI releases and publish the prebuilt index to the rolling `index` pre-release.
# Local installs download <repo>/releases/download/index/{manifest.json,index.sqlite.gz} (see config.DEFAULT_INDEX_URL).
#
# One job per covered package builds that package's snapshots on its own runner, with its own snapshot cache and
# log, so a heavy package can only fail itself (DT-DATA-03). The publish job then assembles the index from those
# snapshots without downloading or analysing anything. It starts from the published index, so a package whose job
# failed tonight keeps the releases it already had (DT-DATA-12).
on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

env:
  DEPTIME_HOME: ${{ github.workspace }}/.deptime
  DEPTIME_OFFLINE: "1" # no background index download or refresh; `ingest` and the explicit `index pull` still run

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      snapshot_format: ${{ steps.list.outputs.snapshot_format }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: List the covered packages
        id: list
        run: |
          packages=$(uv run --no-dev python -c 'import json; from deptime.config import Settings, load_coverage; print(json.dumps([p.name for p in load_coverage(Settings.from_env().coverage_file).packages]))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages"
          echo "snapshot_format=$(uv run --no-dev python -c 'from deptime.ingest.snapshot import SNAPSHOT_FORMAT; print(SNAPSHOT_FORMAT)')" >> "$GITHUB_OUTPUT"

  snapshots:
    name: snapshots (${{ matrix.package }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev

      # `|` can't occur in a package name, so one package's prefix never matches another's (langchain vs langchain-core).
      # The snapshot format is in the key: snapshots from an older extractor would only be rebuilt.
      - name: Restore this package's snapshot cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deptime/build/snapshots/${{ matrix.package }}
          key: snapshots|${{ needs.plan.outputs.snapshot_format }}|${{ matrix.package }}|latest
          restore-keys: snapshots|${{ needs.plan.outputs.snapshot_format }}|${{ matrix.package }}|

      - name: Build the snapshots that aren't cached yet
        timeout-minutes: 320
        continue-on-error: true # a timed-out cold build still saves its progress below; the next run carries on
        run: |
          # Memory use every minute, so a runner that dies mid-build still leaves a trace in the log.
          ( while sleep 60; do free -m | awk 'NR==2 {print "[memory] " $3 " MB used of " $2}'; done ) &
          trap "kill $!" EXIT
          uv run deptime ingest "${{ matrix.package }}"

      - name: Resources used
        if: always()
        run: |
          free -m
          df -h .
          du -sh .deptime/build/snapshots 2>/dev/null || true

      - name: Snapshot cache key
        id: key
        if: always()
        run: echo "key=snapshots|${{ needs.plan.outputs.snapshot_format }}|${{ matrix.package }}|${{ hashFiles(format('.deptime/build/snapshots/{0}/**', matrix.package)) }}" >> "$GITHUB_OUTPUT"

      - name: Save this package's snapshot cache (also after a timeout; skipped when nothing changed)
        if: always() && !endsWith(steps.key.outputs.key, '|') && steps.key.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deptime/build/snapshots/${{ matrix.package }}
          key: ${{ steps.key.outputs.key }}

      - name: Hand the snapshots to the publish job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-${{ matrix.package }}
          path: .deptime/build/snapshots/
          include-hidden-files: true # the path is under .deptime/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0 # already gzipped

  publish:
    needs: [plan, snapshots]
    # Runs even when some package jobs failed: those packages keep their published releases.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # upload release assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev

      - name: Collect every package's snapshots
        continue-on-error: true # a package without snapshots keeps its published releases
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snapshots-*
          path: .deptime/build/snapshots
          merge-multiple: true

      # Ingesting into last night's index keeps a release that has no snapshot tonight (DT-DATA-12).
      # sha256 and schema are checked as for users.
      - name: Start from the published index
        run: uv run deptime index pull || echo "::notice::no compatible published index; building from snapshots only"

      - name: Assemble the index from the snapshots (never downloads or analyses a release)
        run: |
          uv run deptime ingest --all --into-downloaded --cached-only \
            || echo "::warning::some releases have no snapshot tonight; see the log above"

      - name: Resources used
        if: always()
        run: |
          free -m
          df -h .
          du -sh .deptime/build/snapshots .deptime/*.sqlite 2>/dev/null || true

      - name: Pack
        run: uv run deptime index pack --out dist

      - name: Guard against publishing a shrunken index
        run: |
          new=$(jq .packages dist/manifest.json)
          if gh release download index --pattern manifest.json --dir prev 2>/dev/null; then
            old=$(jq .packages prev/manifest.json)
            echo "packages: previous=$old new=$new"
            if [ "$new" -lt $(( old * 9 / 10 )) ]; then
              echo "::error::new index has $new packages vs $old published; refusing to publish"
              exit 1
            fi
          fi

      - name: Publish to the rolling `index` release
        run: |
          gh release view index >/dev/null 2>&1 || gh release create index --prerelease \
            --title "DepTime index (rolling)" \
            --notes "Nightly prebuilt index, downloaded automatically by \`deptime mcp\` and \`deptime index pull\`."
          gh release upload index dist/index.sqlite.gz dist/manifest.json --clobber
