# Golden facts for each Tier A package (DT-QA-03): names its own documentation uses, which the newest indexed
# release must have. tests/test_golden.py checks them against the published index after every build (bench.yml).
# Like the benchmark's answers, each comes from the package's README, docs or source at a release, never from
# DepTime. A name a later release drops is a real change: replace it with one that release documents.

