name: Bug report
description: Something crashed or misbehaved (install, index download, MCP connection, CLI)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "uvx deptime mcp ... / claude mcp add ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "deptime 0.1.1, macOS 15, Python 3.12, Claude Code 2.1.281"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (stderr)
      render: text
